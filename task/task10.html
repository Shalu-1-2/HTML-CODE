<!DOCTYPE html>
<html>

<head>
    <title>SVG Shapes</title>
</head>

<body>

    <svg width="350" height="180">

        <!-- Gradient -->
        <defs>
            <linearGradient id="myGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="orange" />
                <stop offset="100%" stop-color="purple" />
            </linearGradient>
        </defs>

        <rect x="10" y="20" width="130" height="130" rx="15" fill="url(#myGradient)" />

        <polygon points="220,30 160,140 280,140" fill="gold" stroke="orange" stroke-width="5" />

    </svg>

</body>

</html>
